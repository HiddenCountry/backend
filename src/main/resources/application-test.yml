spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${TEST_DB_NAME}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    hikari:
      maximum-pool-size: 1000
      minimum-idle: 10
      connection-timeout: 5000
      validation-timeout: 1000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
